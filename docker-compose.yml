# TRANSITIONAL — see the header of Dockerfile. Production is moving to App Engine;
# this file and docker-compose.coolify.yml stay only until that cutover is verified.
#
# Portable deployment — app + Redis as one stack. Runs on any Docker host:
# a GCE / EC2 VM, a bare-metal box, or your laptop.
#
#   cp .env.example .env    # fill in WORK_API_BASE_URL, PUBLIC_BASE_URL, REDIS_PASSWORD
#   docker compose up -d --build
#   curl http://127.0.0.1:3000/health
#
# The Redis password is read from REDIS_PASSWORD, falling back to Coolify's
# generated SERVICE_PASSWORD_REDIS. That fallback exists because a Coolify resource
# pointed at THIS file (rather than at docker-compose.coolify.yml) supplies only the
# SERVICE_* magic vars, and the deploy then dies during interpolation — before any
# build output — with "required variable REDIS_PASSWORD is missing a value".
#
# Full step-by-step guide (VM, Cloud Run, any platform): see DEPLOYMENT.md.
#
# TLS is NOT terminated here. Put a reverse proxy (Caddy, nginx, a cloud load
# balancer) in front — the app only ever listens on plain HTTP, and PUBLIC_BASE_URL
# must be the https URL clients actually hit.
#
# Coolify uses a different file: docker-compose.coolify.yml. The local-dev Redis
# lives in docker-compose.dev.yml, which is standalone and is NOT an overlay on this
# file — `npm run dev` passes it explicitly.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Bound to loopback: the reverse proxy on this host forwards to it. Change to
    # "3000:3000" only if the proxy is on another host/container network.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Must equal the public https URL clients hit — OAuth redirects and the
      # /.well-known discovery metadata are built from it.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required (e.g. https://mcp.example.com)}
      - WORK_API_BASE_URL=${WORK_API_BASE_URL:?WORK_API_BASE_URL is required}
      - IDENTITY_SERVER=${IDENTITY_SERVER:-https://ix-id.lincx.la}
      - REDIS_URL=redis://default:${REDIS_PASSWORD:-${SERVICE_PASSWORD_REDIS:?set REDIS_PASSWORD (or let Coolify provide SERVICE_PASSWORD_REDIS)}}@redis:6379
      - STATS_TOKEN=${STATS_TOKEN:-}
      - USAGE_EVENT_CAP=${USAGE_EVENT_CAP:-50000}
      - RESPONSE_SIZE_LIMIT=${RESPONSE_SIZE_LIMIT:-30000}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-${SERVICE_PASSWORD_REDIS:?set REDIS_PASSWORD (or let Coolify provide SERVICE_PASSWORD_REDIS)}} --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-${SERVICE_PASSWORD_REDIS}}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
