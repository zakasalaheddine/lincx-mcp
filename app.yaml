# GAE Standard service config for lincx-mcp-server.
#
# SINGLE INSTANCE IS NO LONGER A CORRECTNESS REQUIREMENT. It used to be: MCP
# transport state lived in an in-process Map in src/server.js and a second
# instance gave intermittent "session not found". The transport is stateless now
# (sessionIdGenerator: undefined, identity from the OAuth bearer), so any number
# of instances can serve any request.
#
# The pin below stays until it is lifted as ITS OWN deploy — and lifting it has
# one open blocker: src/middleware/rateLimit.js counts in-process, so N instances
# silently means N x 120 req/min. Move that to Redis first.
# See CLAUDE.md § Deployment and DEPLOYMENT.md § Scaling.
#
# Before the first deploy, replace every <PLACEHOLDER> below. `gcloud app deploy`
# fails loudly on the vpc_access_connector one, so it cannot ship unnoticed.

runtime: nodejs22
service: default

# MANUAL SCALING — now a deliberate hold, not a constraint.
#
# The original two reasons are both spent:
#   1. It pinned the instance count at one, which WAS the correctness
#      requirement. The stateless transport removed that requirement.
#   2. Automatic scaling caps a request at 10 minutes, and GET /mcp was the only
#      SSE surface that could outlive it. GET /mcp no longer exists — POST
#      answers JSON (enableJsonResponse: true) and returns promptly — so the
#      request-duration cap is no longer a blocker either.
#
# What remains is the staged rollout: land stateless on one instance, watch it,
# then raise the count (after the rate-limiter move above). Changing both at once
# makes a regression unattributable.
#
# Manual scaling sends /_ah/start; a non-200 there means the instance never
# becomes healthy. src/http/router.js answers it (plus /_ah/stop, /_ah/warmup).
manual_scaling:
  instances: 1

inbound_services:
  - warmup

# instance_class: deliberately left at the runtime default for the first deploy.
# Task 23 measures real memory under a whole-network scan
# (get_zone_eligible_ad_groups on the largest network) and sets it from that
# measurement — a guessed tier is either an outage or a bill.

env_variables:
  NODE_ENV: "production"
  WORK_API_BASE_URL: "https://api.lincx.com"
  PUBLIC_BASE_URL: "https://mcp.lincx.com"
  IDENTITY_SERVER: "https://ix-id.lincx.la"
  RESPONSE_SIZE_LIMIT: "30000"
  USAGE_EVENT_CAP: "50000"

# PUBLIC_BASE_URL must match the URL clients actually hit, with NO trailing
# slash: it is echoed as the OAuth `issuer` and in the WWW-Authenticate
# resource_metadata challenge. A mismatch breaks the OAuth redirect with no
# useful client-side error.

# REDIS_URL and STATS_TOKEN are deliberately absent — this file is committed to
# git. src/config/secrets.js reads them from Secret Manager at boot.

# Memorystore is reachable only from inside the VPC, so the connector is
# required, not optional: without it REDIS_URL times out and the server falls
# back to the in-memory store, which logs every user out on each redeploy.
vpc_access_connector:
  name: projects/<PROJECT_ID>/locations/<REGION>/connectors/<CONNECTOR_NAME>
