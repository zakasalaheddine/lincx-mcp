# Deploy on a push to master. Lint and tests gate the deploy — a red suite must
# never reach production, so the gcloud step only runs if every step above it
# exited 0.
steps:
  - name: 'node:22'
    entrypoint: npm
    args: ['ci']

  - name: 'node:22'
    entrypoint: npm
    args: ['run', 'lint']

  - name: 'node:22'
    entrypoint: npm
    args: ['test']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: ['app', 'deploy', 'app.yaml', '--quiet']

  # Read-only, unauthenticated post-deploy check (#69 Task 28). It is what catches a
  # PUBLIC_BASE_URL mismatch, which otherwise breaks OAuth with no client-side error.
  - name: 'node:22'
    entrypoint: node
    args: ['scripts/smoke-prod.mjs', 'https://mcp.lincx.com']

options:
  logging: CLOUD_LOGGING_ONLY
timeout: '1200s'
