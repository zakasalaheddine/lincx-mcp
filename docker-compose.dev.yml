# Local-dev Redis, and nothing else.
#
# This is the ONLY compose file left in the repo — production is App Engine (see
# DEPLOYMENT.md). It used to be an overlay on docker-compose.yml; that file is
# gone, so this one is now standalone and defines only `redis`. The npm scripts
# pass it explicitly:
#
#   docker compose -f docker-compose.dev.yml up -d redis
#   npm run redis:stop
#
# The password is a throwaway local value. Point .env at it with:
#   REDIS_URL=redis://default:localdev@localhost:6380
services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass localdev --appendonly yes
    restart: unless-stopped
    # Host port is 6380, not 6379: lincx-core's test stack binds 6379, so this
    # container failed to start and the dev server silently fell through to
    # lincx-core's redis — which never held this server's oauth:client:* keys
    # (every authorize returned "Unknown client_id"). Sharing that redis is also
    # unsafe: lincx-core's test suite FLUSHALLs it.
    ports:
      - "6380:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "localdev", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-dev-data:
